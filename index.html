let category='all';

let cart=JSON.parse(localStorage.getItem('snb_cart')||'[]');
let products=DEFAULT_PRODUCTS.map(p=>({...p,sizes:String(p.sizes||'One Size').split(',').map(s=>s.trim()).filter(Boolean)}));
let customers=[];
let orders=[];
let myOrders=[];

const PASSWORD_RETURN_URL=APP_URL+'?auth=recovery';
const IS_RECOVERY_RETURN=new URLSearchParams(location.search).get('auth')==='recovery'||/(?:^|[&#])type=recovery/.test(location.hash);

const t=k=>I18N[lang]?.[k]||I18N.en[k]||k;
function saveLocal(){localStorage.setItem('snb_cart',JSON.stringify(cart))}
function money(v){return new Intl.NumberFormat(lang==='ar'?'ar-AE':'en-AE',{style:'currency',currency:'AED',maximumFractionDigits:2}).format(Number(v||0))}
function finalPrice(p){return +(Number(p.price||0)*(1-Number(p.discount||0)/100)).toFixed(2)}
function normalizeProduct(p){const variants=(Array.isArray(p.product_variants)?p.product_variants:[]).map(v=>({...v,stock:Number(v.stock||0)})).sort((a,b)=>String(a.size).localeCompare(String(b.size),undefined,{numeric:true})||String(a.color).localeCompare(String(b.color)));return {...p,price:Number(p.price||0),discount:Number(p.discount||0),stock:Number(p.stock||0),sizes:Array.isArray(p.sizes)?p.sizes:String(p.sizes||'One Size').split(',').map(s=>s.trim()).filter(Boolean),variants,image:p.image_url||p.image||''}}
function productSvg(p){const c=p.color||'#6b3e25', gold='#d7a84e';let shape='';if(p.type==='bag')shape=`<path d="M28 42h64v46H28z" fill="${c}" stroke="${gold}" stroke-width="2.6" rx="8"/><path d="M45 42c0-19 30-19 30 0" fill="none" stroke="${gold}" stroke-width="5" stroke-linecap="round"/><path d="M34 54h52" stroke="rgba(255,255,255,.2)"/>`;else if(p.type==='wallet')shape=`<rect x="25" y="37" width="70" height="48" rx="9" fill="${c}" stroke="${gold}" stroke-width="2.6"/><path d="M65 53h30v18H65z" fill="rgba(0,0,0,.3)" stroke="${gold}"/><circle cx="84" cy="62" r="3" fill="${gold}"/>`;else shape=`<path d="M18 73c17 0 25-8 31-26 4-12 12-18 21-14 8 3 9 13 17 18 8 6 17 9 23 13 7 5 5 17-3 19-24 6-64 5-86 0-9-2-10-3-10z" fill="${c}" stroke="${gold}" stroke-width="2.6"/><path d="M48 52l30 11M52 46l28 11" stroke="${gold}" stroke-width="2"/>`;return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="g${String(p.id).replace(/[^a-zA-Z0-9]/g,'')}" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs>${shape}<rect width="120" height="120" fill="url(#g${String(p.id).replace(/[^a-zA-Z0-9]/g,'')})" opacity=".7"/></svg>`}
function productVisual(p){const src=p.image_url||p.image||'';return src?`<img src="${escapeHtml(src)}" alt="${escapeHtml(p.name||'SNB product')}" loading="lazy">`:productSvg(p)}
function previewProductImage(input){const file=input.files&&input.files[0];if(!file)return;const img=document.getElementById('pImagePreview');if(img){img.src=URL.createObjectURL(file);img.classList.remove('hidden')}}
function compressProductImageBlob(file,targetW=1200,targetH=1500,quality=.84){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const canvas=document.createElement('canvas');canvas.width=targetW;canvas.height=targetH;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,targetW,targetH);const scale=Math.min(targetW/im.width,targetH/im.height,1);const w=Math.round(im.width*scale),h=Math.round(im.height*scale);const x=Math.round((targetW-w)/2),y=Math.round((targetH-h)/2);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(im,x,y,w,h);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Image compression failed')),'image/webp',quality)};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));const ls=document.getElementById('langSelect');if(ls)ls.value=lang;renderFilters();renderProducts();updateCartBadge();updateAuthUI()}
document.getElementById('langSelect').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('snb_lang',lang);applyLang()});
function renderFilters(){const cats=['all','shoes','bags','wallets'];document.getElementById('filters').innerHTML=cats.map(c=>`<button class="chip ${!wishlistOnly&&category===c?'active':''}" onclick="setCategory('${c}')">${t(c)}</button>`).join('')+`<button class="chip ${wishlistOnly?'active':''}" onclick="toggleWishlistFilter()">♡ ${lang==='ar'?'المفضلة':'Wishlist'}</button>`}
function setCategory(c){wishlistOnly=false;category=c;renderFilters();renderProducts()}
function setSearch(q){searchQuery=String(q||'').trim().toLowerCase();renderProducts()}
function toggleWishlistFilter(){if(!currentUser){openAuth(false);return}wishlistOnly=!wishlistOnly;renderFilters();renderProducts()}
async function loadProducts(){const {data,error}=await sb.from('products').select('*,product_variants(*)').order('created_at',{ascending:false});if(error){console.error(error);return false}products=(data||[]).map(normalizeProduct);cart=cart.map(i=>{const p=products.find(x=>x.id===i.id);if(!p)return i;if(i.variant_id&&p.variants.some(v=>v.id===i.variant_id))return i;const v=p.variants.find(v=>v.size===i.size)||p.variants.find(v=>v.stock>0)||p.variants[0];return v?{...i,variant_id:v.id,size:v.size,color:v.color}:i});saveLocal();renderProducts();return true}
function renderProducts(){const list=products.filter(p=>p.active&&(category==='all'||p.category===category)&&(!wishlistOnly||wishlist.has(p.id))&&(!searchQuery||String(p.name||'').toLowerCase().includes(searchQuery)||String(p.category||'').toLowerCase().includes(searchQuery)));const grid=document.getElementById('productGrid');if(!grid)return;grid.innerHTML=list.map(p=>`<article class="product">${p.discount?`<div class="sale">-${p.discount}%</div>`:''}<button aria-label="Wishlist" onclick="toggleWishlist(event,'${p.id}')" style="position:absolute;top:10px;right:10px;z-index:4;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(8,7,5,.86);color:${wishlist.has(p.id)?'#f3d58c':'#fff'};font-size:20px;cursor:pointer">${wishlist.has(p.id)?'♥':'♡'}</button><div class="product-media" onclick="viewProduct('${p.id}')">${productVisual(p)}</div><div class="product-body"><h4>${escapeHtml(p.name)}</h4><div class="price"><strong>${money(finalPrice(p))}</strong>${p.discount?`<span class="old">${money(p.price)}</span>`:''}</div><div class="meta"><span>${t('stock')}: ${p.stock}</span><span>${t(p.category)}</span></div><div class="product-actions"><button class="btn gold small" onclick="addToCart('${p.id}')">${t('addCart')}</button><button class="btn small" onclick="viewProduct('${p.id}')">⌕</button></div></div></article>`).join('')||`<div class="empty" style="grid-column:1/-1">${lang==='ar'?'لا توجد نتائج':'No results'}</div>`}
function updateCartBadge(){const el=document.getElementById('cartBadge');if(el)el.textContent=cart.reduce((s,i)=>s+i.qty,0)}
function addToCart(id,variantId=''){const p=products.find(x=>x.id===id);if(!p)return;const available=(p.variants||[]).filter(v=>v.stock>0);if(!available.length)return toast(lang==='ar'?'نفد المخزون':'Out of stock');if(!variantId&&available.length>1){viewProduct(id);return toast(lang==='ar'?'اختر المقاس واللون أولاً':'Choose size and color first')}const v=variantId?(p.variants||[]).find(x=>x.id===variantId):available[0];if(!v||v.stock<1)return toast(lang==='ar'?'هذا الخيار غير متوفر':'This option is out of stock');const found=cart.find(i=>i.id===id&&i.variant_id===v.id);const current=found?.qty||0;if(current>=v.stock)return toast(lang==='ar'?('المتوفر من هذا الخيار فقط '+v.stock+' قطعة'):(('Only '+v.stock+' available for this option')));if(found)found.qty++;else cart.push({id,variant_id:v.id,qty:1,size:v.size,color:v.color});saveLocal();updateCartBadge();toast(t('addCart')+' ✓')}
function viewProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const variants=(p.variants||[]).filter(v=>v.stock>0);showModal(`<div class="modal-head"><h3>${escapeHtml(p.name)}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="productdetail"><div class="product-media product-detail-media" style="border-radius:18px">${productVisual(p)}</div><div><div class="price"><strong style="font-size:25px">${money(finalPrice(p))}</strong>${p.discount?`<span class="old">${money(p.price)}</span>`:''}</div><p class="muted">SNB Leather Goods · SUBSTANCE • NUANCE • BRILLIANCE</p><div class="field"><label>${lang==='ar'?'المقاس / اللون':'Size / Color'}</label><select id="modalVariant" ${variants.length?'':'disabled'}>${variants.length?variants.map(v=>`<option value="${v.id}">${escapeHtml(v.size)} · ${escapeHtml(v.color)} · ${t('stock')}: ${v.stock}</option>`).join(''):`<option>${lang==='ar'?'نفد المخزون':'Out of stock'}</option>`}</select></div><p>${t('stock')}: <b>${p.stock}</b></p><button class="btn gold" style="width:100%" ${variants.length?'':'disabled'} onclick="addToCart('${p.id}',document.getElementById('modalVariant').value);closeOverlay()">${t('addCart')}</button></div></div>`)}
function openCart(){const items=cart.map(i=>{const p=products.find(x=>x.id===i.id);const v=p?(p.variants||[]).find(x=>x.id===i.variant_id):null;return p?{...i,p,v}:null}).filter(Boolean);const subtotal=items.reduce((s,i)=>s+i.p.price*i.qty,0),total=items.reduce((s,i)=>s+finalPrice(i.p)*i.qty,0);showDrawer(`<div class="drawer-head"><h3>${t('cart')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div>${items.length?items.map((i,idx)=>`<div class="cart-item"><div class="cart-thumb">${productVisual(i.p)}</div><div><b>${escapeHtml(i.p.name)}</b><div class="muted" style="font-size:12px;margin-top:5px">${t('size')}: ${escapeHtml(i.size||i.v?.size||'—')} · ${t('color')}: ${escapeHtml(i.color||i.v?.color||'—')}</div><div style="color:#f1cf7f;margin-top:5px">${money(finalPrice(i.p))}</div><div class="qty" style="margin-top:8px"><button onclick="cartQty(${idx},-1)">−</button><b>${i.qty}</b><button onclick="cartQty(${idx},1)">+</button></div></div><button class="iconbtn" onclick="removeCart(${idx})">🗑</button></div>`).join(''):`<div class="empty">${t('emptyCart')}</div>`}${items.length?`<div class="totals"><div class="totalrow"><span>${t('subtotal')}</span><span>${money(subtotal)}</span></div><div class="totalrow"><span>${t('discount')}</span><span>− ${money(subtotal-total)}</span></div><div class="totalrow"><span>${t('shipping')}</span><span>${t('free')}</span></div><div class="totalrow big"><span>${t('total')}</span><span>${money(total)}</span></div><button class="btn gold" style="width:100%;margin-top:10px" onclick="checkout()">${t('checkout')}</button></div>`:''}`)}
function cartQty(idx,d){const item=cart[idx];if(!item)return;const p=products.find(x=>x.id===item.id);const v=p?(p.variants||[]).find(x=>x.id===item.variant_id):null;if(d>0){if(!v||item.qty>=v.stock)return toast(lang==='ar'?('المتوفر من هذا الخيار فقط '+(v?.stock||0)+' قطعة'):(('Only '+(v?.stock||0)+' available for this option')))}item.qty+=d;if(item.qty<=0)cart.splice(idx,1);saveLocal();updateCartBadge();openCart()}
function removeCart(idx){cart.splice(idx,1);saveLocal();updateCartBadge();openCart()}
function checkout(){if(!currentUser){closeOverlay();localStorage.setItem('snb_pending_checkout','1');openAuth(true);return}if(!cart.length)return toast(t('emptyCart'));const items=cart.map(i=>{const p=products.find(x=>x.id===i.id);return p?{...i,name:p.name,price:finalPrice(p)}:null}).filter(Boolean);const total=items.reduce((s,i)=>s+i.price*i.qty,0);const emirates=['Dubai','Abu Dhabi','Sharjah','Ajman','Umm Al Quwain','Ras Al Khaimah','Fujairah'];showModal(`<div class="modal-head"><h3>${t('checkout')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="notice">🔒 ${lang==='ar'?'طلبك محفوظ ومربوط بحسابك':'Your order is securely linked to your account'}</div><div class="formgrid"><div class="field"><label>${t('name')}</label><input id="checkoutName" value="${escapeHtml(currentUser.name||'')}" autocomplete="name"></div><div class="field"><label>${t('mobile')}</label><input id="checkoutMobile" value="${escapeHtml(currentUser.mobile||'')}" inputmode="tel" autocomplete="tel"></div><div class="field"><label>${lang==='ar'?'الإمارة':'Emirate'}</label><select id="checkoutEmirate">${emirates.map(e=>`<option value="${e}">${e}</option>`).join('')}</select></div><div class="field"><label>${lang==='ar'?'المدينة / المنطقة':'City / Area'}</label><input id="checkoutCity" placeholder="${lang==='ar'?'مثال: البرشاء 1':'e.g. Al Barsha 1'}"></div></div><div class="field"><label>${lang==='ar'?'عنوان التوصيل بالتفصيل':'Detailed delivery address'}</label><textarea id="address" rows="3" placeholder="${lang==='ar'?'الشارع، المبنى، رقم الشقة/الفيلا':'Street, building, apartment/villa'}"></textarea></div><div class="field"><label>${lang==='ar'?'ملاحظات الطلب':'Order notes'}</label><textarea id="orderNotes" rows="2" maxlength="1000" placeholder="${lang==='ar'?'اختياري':'Optional'}"></textarea></div><div class="field"><label>${lang==='ar'?'طريقة الدفع':'Payment method'}</label><select id="paymentMethod"><option value="cash_on_delivery">${lang==='ar'?'الدفع عند الاستلام':'Cash on delivery'}</option><option value="bank_transfer">${lang==='ar'?'تحويل بنكي':'Bank transfer'}</option><option value="whatsapp">${lang==='ar'?'تأكيد عبر واتساب':'Confirm via WhatsApp'}</option></select></div><div class="totals"><div class="totalrow big"><span>${t('total')}</span><span>${money(total)}</span></div></div><button id="placeOrderBtn" class="btn gold" style="width:100%" onclick="placeOrder()">${lang==='ar'?'تأكيد الطلب':'Place order'}</button>`)}
async function placeOrder(){const name=document.getElementById('checkoutName')?.value.trim()||'';const mobile=document.getElementById('checkoutMobile')?.value.trim()||'';const emirate=document.getElementById('checkoutEmirate')?.value||'';const city=document.getElementById('checkoutCity')?.value.trim()||'';const address=document.getElementById('address')?.value.trim()||'';const notes=document.getElementById('orderNotes')?.value.trim()||'';const payment=document.getElementById('paymentMethod')?.value||'cash_on_delivery';if(name.length<2)return toast(lang==='ar'?'أدخل الاسم':'Enter your name');if(mobile.length<6)return toast(lang==='ar'?'أدخل رقم الموبايل':'Enter your mobile number');if(city.length<2)return toast(lang==='ar'?'أدخل المدينة أو المنطقة':'Enter city or area');if(address.length<5)return toast(lang==='ar'?'أدخل عنوان التوصيل':'Enter delivery address');const btn=document.getElementById('placeOrderBtn');if(btn){btn.disabled=true;btn.textContent=lang==='ar'?'جارٍ إنشاء الطلب…':'Creating order…'}const payload=cart.map(i=>({id:i.id,variant_id:i.variant_id,size:i.size,color:i.color,qty:i.qty}));const {data,error}=await sb.rpc('place_order_v2',{p_items:payload,p_customer_name:name,p_mobile:mobile,p_emirate:emirate,p_city:city,p_address:address,p_notes:notes||null,p_payment_method:payment});if(error){if(btn){btn.disabled=false;btn.textContent=lang==='ar'?'تأكيد الطلب':'Place order'}toast(error.message||'Order failed');await loadProducts();return}const o=data?.[0];currentUser={...currentUser,name,mobile};cart=[];saveLocal();updateCartBadge();await Promise.all([loadProducts(),loadMyOrders()]);showModal(`<div class="success"><div class="check">✓</div><h3>${lang==='ar'?'تم استلام طلبك بنجاح':'Order received successfully'}</h3><p>${t('orderNo')}: <b>${escapeHtml(o?.order_no||'SNB')}</b></p><p style="color:#f2cf7b;font-size:22px"><b>${money(o?.total||0)}</b></p><p class="muted">${lang==='ar'?'يمكنك متابعة الطلب مرحلة بمرحلة من حسابك.':'Track every stage from My Account.'}</p><button class="btn gold" onclick="closeOverlay();renderAccount()">${lang==='ar'?'تتبّع طلبي':'Track my order'}</button></div>`)}

function signedInLabel(){return ({ar:'تم تسجيل الدخول',en:'Signed in',fr:'Connecté',es:'Sesión iniciada',ru:'Вход выполнен',it:'Accesso effettuato',de:'Angemeldet'})[lang]||'Signed in'}
function statusLabel(s){const ar={received:'تم استلام الطلب',confirmed:'تم التأكيد',preparing:'قيد التجهيز',shipped:'تم الشحن',out_for_delivery:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي'};const en={received:'Order received',confirmed:'Confirmed',preparing:'Preparing',shipped:'Shipped',out_for_delivery:'Out for delivery',delivered:'Delivered',cancelled:'Cancelled'};return lang==='ar'?(ar[s]||s):(en[s]||String(s||'').replaceAll('_',' '))}

function subscribeOrderUpdates(){if(orderChannel){sb.removeChannel(orderChannel);orderChannel=null}if(!currentUser)return;orderChannel=sb.channel('snb-orders-'+currentUser.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:'user_id=eq.'+currentUser.id},async()=>{await loadMyOrders();toast(lang==='ar'?'تم تحديث حالة طلبك':'Your order status was updated');if(document.getElementById('accountOrders'))renderAccount()}).subscribe()}

function collectVariantEditorRows(){const rows=[...document.querySelectorAll('#variantRows .variant-row')].map(r=>({size:r.querySelector('.vSize')?.value.trim()||'One Size',color:r.querySelector('.vColor')?.value||'#6e381f',stock:Number(r.querySelector('.vStock')?.value||0)}));const seen=new Set();for(const v of rows){const k=v.size+'|'+v.color;if(seen.has(k))throw new Error(lang==='ar'?'يوجد مقاس/لون مكرر':'Duplicate size/color option');seen.add(k);if(v.stock<0||!Number.isFinite(v.stock))throw new Error(lang==='ar'?'المخزون غير صحيح':'Invalid stock')}if(!rows.length)throw new Error(lang==='ar'?'أضف خيار مقاس/لون واحد على الأقل':'Add at least one size/color option');return rows}
async function updateOrderTracking(id){const carrier=document.getElementById('carrier-'+id)?.value.trim()||'';const number=document.getElementById('tracking-'+id)?.value.trim()||'';const {error}=await sb.from('orders').update({tracking_carrier:carrier||null,tracking_number:number||null,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message||'Could not save tracking');const o=orders.find(x=>x.id===id);if(o){o.tracking_carrier=carrier;o.tracking_number=number}toast(lang==='ar'?'تم حفظ بيانات التتبع':'Tracking saved')}
function updateAuthUI(){const signed=!!currentUser;const top=document.getElementById('topAccountBtn');const hero=document.getElementById('heroAuthBtn');const bottomLabel=document.getElementById('bottomAccountLabel');const bottomIcon=document.getElementById('bottomAccountIcon');if(top)top.innerHTML=signed?`✓ <span>${accountLabel()}</span>`:`👤 <span>${accountLabel()}</span>`;if(hero)hero.textContent=signed?`✓ ${accountLabel()}`:t('signIn');if(bottomLabel)bottomLabel.textContent=accountLabel();if(bottomIcon)bottomIcon.textContent=signed?'✓':'👤'}

async function renderAccount(){if(!currentUser)return renderAuth('login');await loadMyOrders();showModal(`<div class="modal-head"><h3>${accountLabel()}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="success" style="padding:8px 4px 14px"><div class="check">✓</div><h3 style="margin:8px 0">${escapeHtml(currentUser.name||signedInLabel())}</h3><div class="notice" style="margin:12px 0"><b>${escapeHtml(currentUser.email||'')}</b>${currentUser.mobile?`<br><small>${escapeHtml(currentUser.mobile)}</small>`:''}</div></div><div id="accountOrders"><h4 style="margin:8px 0 10px">${lang==='ar'?'طلباتي وتتبع الشحن':'My Orders & Tracking'}</h4>${myOrders.length?myOrders.map(o=>`<div style="border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${escapeHtml(o.order_no)}</b><span class="status ${o.status==='cancelled'?'warn':'ok'}">${escapeHtml(statusLabel(o.status))}</span></div><div class="muted" style="font-size:12px;margin-top:6px">${new Date(o.created_at).toLocaleString()}</div>${orderProgressHtml(o)}<div style="margin:8px 0">${(o.order_items||[]).map(i=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(215,168,78,.09)"><span>${escapeHtml(i.product_name)} × ${i.qty}<small class="muted"> · ${escapeHtml(i.size||'—')} · ${escapeHtml(i.color||'—')}</small></span><b>${money(Number(i.unit_price||0)*Number(i.qty||0))}</b></div>`).join('')}</div>${o.tracking_number?`<div class="notice" style="margin:8px 0">📦 <b>${lang==='ar'?'رقم التتبع':'Tracking'}:</b> ${escapeHtml(o.tracking_number)}${o.tracking_carrier?` · ${escapeHtml(o.tracking_carrier)}`:''}</div>`:''}<div class="muted" style="font-size:12px">${escapeHtml([o.emirate,o.city,o.address].filter(Boolean).join(' · '))}</div><div style="margin-top:9px;color:#f2cf7b;font-size:18px"><b>${money(o.total)}</b></div></div>`).join(''):`<div class="empty">${lang==='ar'?'لا توجد طلبات بعد':'No orders yet'}</div>`}</div><button class="btn ghost" style="width:100%;margin-top:12px" onclick="logoutCustomer()">${t('logout')}</button>`)}
function openAuth(fromCheckout=false){if(currentUser){if(fromCheckout){checkout();return}return renderAccount()}window._auth={fromCheckout};renderAuth('login')}
function authErrorText(error,fallback='Authentication error'){
  const raw=String(error?.message||error?.error_description||fallback||'');
  if(/rate.?limit|too many|after \d+ seconds|429/i.test(raw))return lang==='ar'?'تم طلب عدة رسائل بسرعة. انتظر قليلاً ثم أعد المحاولة.':'Too many email requests. Please wait a little and try again.';
  if(/expired|invalid.*(?:link|token)|one-time token/i.test(raw))return lang==='ar'?'رابط التحقق غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة.':'This verification link is invalid or expired. Request a new email.';
  return raw||fallback;
}
async function resendSignupConfirmation(email){
  email=String(email||'').trim().toLowerCase();
  if(!email.includes('@'))return toast(lang==='ar'?'أدخل بريداً إلكترونياً صحيحاً':'Enter a valid email');
  const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:AUTH_RETURN_URL}});
  if(error)return toast(authErrorText(error,lang==='ar'?'تعذر إعادة إرسال الرسالة':'Could not resend confirmation'));
  toast(lang==='ar'?'تم إرسال رسالة تأكيد جديدة':'A new confirmation email was sent');
}
function showAuthLinkError(){
  if(!AUTH_ERROR_CODE&&!AUTH_ERROR_DESCRIPTION)return false;
  const msg=lang==='ar'?'رابط التحقق غير صالح أو انتهت صلاحيته. يمكنك تسجيل الدخول إذا كان الحساب مؤكداً، أو طلب رسالة جديدة من شاشة التسجيل.':'This verification link is invalid or expired. Sign in if your account is already confirmed, or request a new confirmation from registration.';
  try{history.replaceState({},document.title,APP_URL)}catch(e){}
  showModal(`<div class="success"><div class="check" style="color:#ffb0b0">!</div><h3>${lang==='ar'?'رابط التحقق انتهى':'Verification link expired'}</h3><p class="muted">${msg}</p><button class="btn gold" style="width:100%" onclick="renderAuth('login')">${t('login')}</button><button class="btn" style="width:100%;margin-top:8px" onclick="renderAuth('signup')">${lang==='ar'?'إنشاء حساب / إعادة الإرسال':'Create account / resend'}</button></div>`);
  return true;
}
function renderAuth(mode='login'){const a=window._auth||{fromCheckout:false};if(mode==='signup')return showModal(`<div class="modal-head"><h3>${t('signup')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="field"><label>${t('name')}</label><input id="regName" autocomplete="name"></div><div class="field"><label>${t('mobile')}</label><input id="regMobile" inputmode="tel" autocomplete="tel"></div><div class="field"><label>${t('email')}</label><input id="regEmail" type="email" autocomplete="email"></div><div class="field"><label>${t('password')}</label><input id="regPassword" type="password" minlength="8" autocomplete="new-password"></div><button class="btn gold" style="width:100%" onclick="signupCustomer()">${t('signup')}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="renderAuth('login')">${t('login')}</button>`);

showModal(`<div class="modal-head"><h3>${t('login')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="field"><label>${t('email')}</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>${t('password')}</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button class="btn gold" style="width:100%" onclick="loginCustomer()">${t('login')}</button><button class="btn" style="width:100%;margin-top:8px" onclick="sendLoginLink()">${lang==='ar'?'أرسل رابط دخول إلى بريدي':'Email me a sign-in link'}</button><div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" style="flex:1" onclick="renderAuth('signup')">${t('signup')}</button><button class="btn ghost" style="flex:1" onclick="renderAuth('forgot')">${t('forgot')}</button></div>`) }
async function signupCustomer(){const name=document.getElementById('regName')?.value.trim()||'';const mobile=document.getElementById('regMobile')?.value.trim()||'';const email=document.getElementById('regEmail')?.value.trim().toLowerCase()||'';const password=document.getElementById('regPassword')?.value||'';if(!name||!email.includes('@')||password.length<8)return toast(lang==='ar'?'أدخل الاسم والبريد وكلمة مرور من 8 أحرف':'Enter name, valid email and an 8+ character password');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:AUTH_RETURN_URL,data:{name,mobile}}});if(error)return toast(authErrorText(error,'Sign up failed'));if(data?.session){await setSignedInCustomer(data.user);showAuthWelcome();return}showModal(`<div class="success"><div class="check">✉</div><h3>${lang==='ar'?'تحقق من بريدك الإلكتروني':'Check your email'}</h3><p>${lang==='ar'?'أرسلنا رسالة التأكيد إلى':'We sent a confirmation email to'}</p><p style="color:#f2cf7b"><b>${escapeHtml(email)}</b></p><p class="muted">${lang==='ar'?'اضغط زر تأكيد التسجيل داخل الرسالة، وبعدها سيصبح حسابك جاهزاً.':'Open the email and confirm your registration, then your account will be ready.'}</p><button class="btn" style="width:100%;margin-top:10px" data-email="${escapeHtml(email)}" onclick="resendSignupConfirmation(this.dataset.email)">↻ ${lang==='ar'?'إعادة إرسال رسالة التأكيد':'Resend confirmation email'}</button></div>`)}
async function loginCustomer(){const email=document.getElementById('loginEmail')?.value.trim().toLowerCase()||'';const password=document.getElementById('loginPassword')?.value||'';if(!email||!password)return toast(lang==='ar'?'أدخل البريد وكلمة المرور':'Enter email and password');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message||'Login failed');await setSignedInCustomer(data.user);closeOverlay();if(window._auth?.fromCheckout)setTimeout(checkout,100);else renderAccount()}
async function sendLoginLink(){const email=document.getElementById('loginEmail')?.value.trim().toLowerCase()||'';if(!email.includes('@'))return toast(lang==='ar'?'أدخل البريد الإلكتروني':'Enter your email');if(window._auth?.fromCheckout)localStorage.setItem('snb_pending_checkout','1');const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:AUTH_RETURN_URL}});if(error){if(error.code==='otp_disabled'||/Signups not allowed/i.test(error.message||''))return toast(lang==='ar'?'هذا البريد غير مسجّل. اختر إنشاء حساب أولاً.':'This email is not registered. Create an account first.');return toast(authErrorText(error,'Could not send sign-in link'))}showModal(`<div class="success"><div class="check">✉</div><h3>${lang==='ar'?'افتح بريدك الإلكتروني':'Check your email'}</h3><p>${lang==='ar'?'أرسلنا رابط دخول إلى':'We sent a sign-in link to'}</p><p style="color:#f2cf7b"><b>${escapeHtml(email)}</b></p></div>`)}
async function sendPasswordReset(){const email=document.getElementById('forgotEmail')?.value.trim().toLowerCase()||'';if(!email.includes('@'))return toast(lang==='ar'?'أدخل البريد الإلكتروني':'Enter your email');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:PASSWORD_RETURN_URL});if(error)return toast(authErrorText(error,'Could not send reset email'));showModal(`<div class="success"><div class="check">✉</div><h3>${lang==='ar'?'تم إرسال رابط الاستعادة':'Reset link sent'}</h3><p>${escapeHtml(email)}</p></div>`)}
function renderPasswordReset(){showModal(`<div class="modal-head"><h3>${lang==='ar'?'كلمة مرور جديدة':'New password'}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="field"><label>${t('password')}</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"></div><button class="btn gold" style="width:100%" onclick="setNewPassword()">${lang==='ar'?'حفظ كلمة المرور':'Save password'}</button>`)}
async function setNewPassword(){const password=document.getElementById('newPassword')?.value||'';if(password.length<8)return toast(lang==='ar'?'8 أحرف على الأقل':'At least 8 characters');const {error}=await sb.auth.updateUser({password});if(error)return toast(error.message||'Could not update password');try{history.replaceState({},document.title,APP_URL)}catch(e){}showModal(`<div class="success"><div class="check">✓</div><h3>${lang==='ar'?'تم تغيير كلمة المرور':'Password updated'}</h3><button class="btn gold" onclick="closeOverlay();renderAccount()">${lang==='ar'?'متابعة':'Continue'}</button></div>`)}
async function logoutCustomer(){if(orderChannel){sb.removeChannel(orderChannel);orderChannel=null}const {error}=await sb.auth.signOut();if(error)return toast(error.message||'Could not sign out');currentUser=null;wishlist=new Set();myOrders=[];isAdmin=false;updateAuthUI();renderProducts();closeOverlay();toast(lang==='ar'?'تم تسجيل الخروج بنجاح':'Signed out successfully')}
function showAuthWelcome(){if(authWelcomeShown||IS_RECOVERY_RETURN)return;authWelcomeShown=true;showModal(`<div class="success" style="padding:18px 8px 8px"><div class="check">✓</div><h3 style="margin-bottom:8px">${lang==='ar'?'تم تأكيد بريدك بنجاح ✓':'Confirmed successfully ✓'}</h3><p style="font-size:18px;color:#f3d58c"><b>Welcome to SNB Leather Goods</b></p><p class="muted">${lang==='ar'?'تم تسجيل دخولك وأصبح حسابك جاهزاً.':'You are signed in and your account is ready.'}</p><button class="btn gold" style="width:100%" onclick="closeOverlay();setTimeout(renderAccount,50)">${lang==='ar'?'متابعة إلى حسابي':'Continue to My Account'}</button></div>`);try{history.replaceState({},document.title,APP_URL)}catch(e){}}
async function setSignedInCustomer(u,notify=false){if(!u)return;const {data}=await sb.from('customers').select('id,email,name,mobile,created_at,confirmed_at').eq('id',u.id).maybeSingle();currentUser={id:u.id,name:data?.name||u.user_metadata?.name||u.email?.split('@')[0]||'SNB Customer',email:data?.email||u.email||'',mobile:data?.mobile||u.user_metadata?.mobile||'',created:data?.created_at||u.created_at||''};updateAuthUI();await Promise.all([loadWishlist(),loadMyOrders(),checkAdmin()]);subscribeOrderUpdates();if(notify)showAuthWelcome();if(localStorage.getItem('snb_pending_checkout')==='1'){localStorage.removeItem('snb_pending_checkout');setTimeout(checkout,250)}}
async function syncSupabaseSession(){try{const {data}=await sb.auth.getSession();const u=data?.session?.user;if(u){await setSignedInCustomer(u,false);if(IS_RECOVERY_RETURN)renderPasswordReset();else if(RETURNED_FROM_EMAIL_AUTH)showAuthWelcome();return true}currentUser=null;updateAuthUI();return false}catch(e){console.error(e);return false}}
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'){if(session?.user)await setSignedInCustomer(session.user,false);setTimeout(renderPasswordReset,50);return}if(session?.user){await setSignedInCustomer(session.user,false);if(RETURNED_FROM_EMAIL_AUTH&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))showAuthWelcome()}else if(event==='SIGNED_OUT'){currentUser=null;wishlist=new Set();myOrders=[];isAdmin=false;updateAuthUI();renderProducts()}});
async function loadWishlist(){if(!currentUser){wishlist=new Set();renderProducts();return}const {data,error}=await sb.from('wishlist').select('product_id').eq('user_id',currentUser.id);if(!error)wishlist=new Set((data||[]).map(x=>x.product_id));renderProducts()}
async function toggleWishlist(event,id){event?.stopPropagation();if(!currentUser){openAuth(false);return}if(wishlist.has(id)){const {error}=await sb.from('wishlist').delete().eq('user_id',currentUser.id).eq('product_id',id);if(!error)wishlist.delete(id)}else{const {error}=await sb.from('wishlist').insert({user_id:currentUser.id,product_id:id});if(!error)wishlist.add(id)}renderProducts()}
async function checkAdmin(){isAdmin=false;try{const {data:userData,error:userError}=await sb.auth.getUser();const u=userData?.user;if(userError||!u)return false;const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(error){console.warn('Admin check failed',error);return false}isAdmin=!!data;return isAdmin}catch(e){console.warn('Admin check failed',e);return false}}
async function openAdminLogin(){const {data:userData}=await sb.auth.getUser();const u=userData?.user;if(!u)return showModal(`<div class="modal-head"><h3>SNB Admin</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="notice">${lang==='ar'?'سجّل الدخول بحساب الإدارة أولاً.':'Sign in with the admin account first.'}</div><button class="btn gold" style="width:100%" onclick="closeOverlay();openAuth()">${t('login')}</button>`);if(!currentUser||currentUser.id!==u.id)await setSignedInCustomer(u,false);if(!await checkAdmin())return showModal(`<div class="modal-head"><h3>SNB Admin</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="notice" style="border-color:rgba(209,96,96,.4)">${lang==='ar'?'الحساب المفتوح حالياً ليس حساب إدارة.':'The account currently signed in is not an admin account.'}<br><b>${escapeHtml(u.email||'')}</b></div><button class="btn gold" style="width:100%" onclick="logoutCustomer().then(()=>openAuth())">${lang==='ar'?'تبديل الحساب':'Switch account'}</button>`);closeOverlay();await loadAdminData();renderAdmin('dashboard')}
async function loadAdminData(){const [pd,od,cu]=await Promise.all([sb.from('products').select('*,product_variants(*)').order('created_at',{ascending:false}),sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}),sb.from('customers').select('*').order('created_at',{ascending:false})]);if(pd.error)throw pd.error;if(od.error)throw od.error;if(cu.error)throw cu.error;products=(pd.data||[]).map(normalizeProduct);orders=(od.data||[]).map(o=>({...o,customer:o.customer_name,date:new Date(o.created_at).toLocaleString(),items:o.order_items||[]}));customers=(cu.data||[]).map(c=>({...c,created:new Date(c.created_at).toLocaleString()}))}
function renderAdmin(tab='dashboard'){document.getElementById('customerApp').classList.add('hidden');document.getElementById('bottomnav').classList.add('hidden');const revenue=orders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+Number(o.total||0),0);document.body.insertAdjacentHTML('beforeend',`<div id="adminApp" class="admin"><header class="topbar" style="position:sticky"><div class="logo"><img src="assets/SNB-App-Icon.png"><div class="logo-text"><b>SNB ADMIN</b><small>LEATHER GOODS</small></div></div><div class="spacer"></div><button class="btn" onclick="exitAdmin()">← ${t('shop')}</button></header><div class="admin-shell"><aside class="sidebar"><button class="btn ${tab==='dashboard'?'gold':''}" onclick="renderAdminReplace('dashboard')">▦ ${t('dashboard')}</button><button class="btn ${tab==='products'?'gold':''}" onclick="renderAdminReplace('products')">◇ ${t('products')}</button><button class="btn ${tab==='orders'?'gold':''}" onclick="renderAdminReplace('orders')">🧾 ${t('orders')}</button><button class="btn ${tab==='customers'?'gold':''}" onclick="renderAdminReplace('customers')">👥 ${t('customers')}</button></aside><main class="admin-main" id="adminMain"></main></div></div>`);renderAdminTab(tab,revenue)}
function renderAdminReplace(tab){document.getElementById('adminApp')?.remove();renderAdmin(tab)}
function renderAdminTab(tab,revenue){const el=document.getElementById('adminMain');if(!el)return;if(tab==='dashboard'){el.innerHTML=`<div class="section-head"><div><h3>${t('dashboard')}</h3><span>Supabase Cloud · Live</span></div></div><div class="stats"><div class="stat"><b>${products.length}</b><small>${t('products')}</small></div><div class="stat"><b>${customers.length}</b><small>${t('registered')}</small></div><div class="stat"><b>${orders.length}</b><small>${t('orders')}</small></div><div class="stat"><b>${money(revenue)}</b><small>${lang==='ar'?'إجمالي الطلبات':'Order value'}</small></div></div><div class="notice" style="margin-top:14px">${lang==='ar'?'البيانات الآن مركزية ومتزامنة بين الأجهزة.':'Data is now centrally synced across devices.'}</div>`}
if(tab==='products'){el.innerHTML=`<div class="section-head"><div><h3>${t('products')}</h3><span>${products.length}</span></div><div class="spacer"></div><button class="btn gold" onclick="editProduct()">＋ ${t('addProduct')}</button></div><div class="tablewrap"><table class="table"><thead><tr><th>${t('productName')}</th><th>${t('category')}</th><th>${t('price')}</th><th>${t('discount')}</th><th>${t('stock')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b></td><td>${t(p.category)}</td><td>${money(p.price)}</td><td>${p.discount||0}%</td><td>${p.stock}</td><td><span class="status ${p.active?'ok':'warn'}">${p.active?t('active'):t('inactive')}</span></td><td><button class="btn small" onclick="editProduct('${p.id}')">${t('edit')}</button> <button class="btn small danger" onclick="deleteProduct('${p.id}')">${t('delete')}</button></td></tr>`).join('')}</tbody></table></div>`}
if(tab==='orders'){const sts=['received','confirmed','preparing','shipped','out_for_delivery','delivered','cancelled'];el.innerHTML=`<div class="section-head"><div><h3>${t('orders')}</h3><span>${orders.length}</span></div></div><div class="tablewrap"><table class="table" style="min-width:1180px"><thead><tr><th>${t('orderNo')}</th><th>${t('customer')}</th><th>${t('items')}</th><th>${t('total')}</th><th>${t('status')}</th><th>${lang==='ar'?'التتبع':'Tracking'}</th><th>${t('date')}</th></tr></thead><tbody>${orders.length?orders.map(o=>`<tr><td><b>${escapeHtml(o.order_no)}</b></td><td>${escapeHtml(o.customer||'—')}<br><small class="muted">${escapeHtml(o.mobile||o.email||'')}</small><br><small class="muted">${escapeHtml([o.emirate,o.city].filter(Boolean).join(' · '))}</small></td><td>${(o.items||[]).reduce((s,i)=>s+Number(i.qty||0),0)}</td><td>${money(o.total)}</td><td><select onchange="updateOrderStatus('${o.id}',this.value)">${sts.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${escapeHtml(statusLabel(s))}</option>`).join('')}</select></td><td><input id="carrier-${o.id}" placeholder="${lang==='ar'?'شركة الشحن':'Carrier'}" value="${escapeHtml(o.tracking_carrier||'')}" style="width:110px;margin-bottom:4px"><br><input id="tracking-${o.id}" placeholder="${lang==='ar'?'رقم التتبع':'Tracking no.'}" value="${escapeHtml(o.tracking_number||'')}" style="width:140px"><button class="btn small" style="margin-inline-start:4px" onclick="updateOrderTracking('${o.id}')">✓</button></td><td>${escapeHtml(o.date)}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">—</td></tr>`}</tbody></table></div>`}
if(tab==='customers'){el.innerHTML=`<div class="section-head"><div><h3>${t('customers')}</h3><span>${customers.length}</span></div></div><div class="tablewrap"><table class="table"><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('mobile')}</th><th>${t('date')}</th></tr></thead><tbody>${customers.length?customers.map(c=>`<tr><td><b>${escapeHtml(c.name||'—')}</b></td><td>${escapeHtml(c.email||'—')}</td><td>${escapeHtml(c.mobile||'—')}</td><td>${escapeHtml(c.created)}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">—</td></tr>`}</tbody></table></div>`}}
async function updateOrderStatus(id,status){const {error}=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message||'Could not update order');const o=orders.find(x=>x.id===id);if(o)o.status=status;toast(lang==='ar'?'تم تحديث حالة الطلب':'Order status updated')}
function editProduct(id=''){const p=id?products.find(x=>x.id===id):{id:'p'+Date.now(),name:'',category:'shoes',price:0,discount:0,stock:0,type:'shoe',sizes:['40'],active:true,image_url:'',variants:[{size:'40',color:'#6e381f',stock:0}]};const image=p.image_url||p.image||'';const variants=(p.variants&&p.variants.length)?p.variants:[{size:(p.sizes||['One Size'])[0]||'One Size',color:p.color||'#6e381f',stock:p.stock||0}];showModal(`<div class="modal-head"><h3>${id?t('edit'):t('addProduct')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="field"><label>${lang==='ar'?'صورة المنتج':'Product photo'}</label>${image?`<img id="pImagePreview" class="image-preview" src="${escapeHtml(image)}" alt="">`:`<img id="pImagePreview" class="image-preview hidden" alt="">`}<input id="pImage" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewProductImage(this)"><small class="muted">${lang==='ar'?'اختر صورة من الموبايل. سيتم ضغطها ورفعها للسحابة تلقائياً.':'Choose a photo. It will be compressed and uploaded to the cloud.'}</small></div><div class="formgrid"><div class="field"><label>${t('productName')}</label><input id="pName" value="${escapeHtml(p.name)}"></div><div class="field"><label>${t('category')}</label><select id="pCat"><option value="shoes" ${p.category==='shoes'?'selected':''}>${t('shoes')}</option><option value="bags" ${p.category==='bags'?'selected':''}>${t('bags')}</option><option value="wallets" ${p.category==='wallets'?'selected':''}>${t('wallets')}</option></select></div><div class="field"><label>${t('price')} AED</label><input id="pPrice" type="number" min="0" step="0.01" value="${p.price}"></div><div class="field"><label>${t('discount')} %</label><input id="pDiscount" type="number" min="0" max="90" value="${p.discount}"></div><div class="field"><label>${t('status')}</label><select id="pActive"><option value="1" ${p.active?'selected':''}>${t('active')}</option><option value="0" ${!p.active?'selected':''}>${t('inactive')}</option></select></div></div><div class="notice" style="margin-top:10px">${lang==='ar'?'المخزون الآن مستقل لكل مقاس ولون.':'Stock is now independent for every size/color option.'}</div><div id="variantRows">${variants.map(variantEditorRowHtml).join('')}</div><button type="button" class="btn" style="width:100%;margin-bottom:10px" onclick="addVariantEditorRow()">＋ ${lang==='ar'?'إضافة مقاس/لون':'Add size/color'}</button><button id="saveProductBtn" class="btn gold" style="width:100%" onclick="saveProduct('${p.id}',${id?1:0})">${t('save')}</button>`)}
async function saveProduct(id,exists){const name=document.getElementById('pName')?.value.trim()||'';const cat=document.getElementById('pCat')?.value||'shoes';const price=Number(document.getElementById('pPrice')?.value||0);const discount=Number(document.getElementById('pDiscount')?.value||0);let variants=[];try{variants=collectVariantEditorRows()}catch(e){return toast(e.message)}const stock=variants.reduce((s,v)=>s+v.stock,0);const sizes=[...new Set(variants.map(v=>v.size))];if(!name||price<0||discount<0||discount>90)return toast(lang==='ar'?'تحقق من بيانات المنتج':'Check product data');const old=exists?products.find(x=>x.id===id):null;let image_url=old?.image_url||old?.image||null;const file=document.getElementById('pImage')?.files?.[0];const btn=document.getElementById('saveProductBtn');if(btn){btn.disabled=true;btn.textContent=lang==='ar'?'جارٍ الحفظ…':'Saving…'}if(file){try{const blob=await compressProductImageBlob(file);const path=`${id}/${Date.now()}.webp`;const up=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/webp',cacheControl:'3600',upsert:false});if(up.error)throw up.error;image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}catch(e){if(btn){btn.disabled=false;btn.textContent=t('save')}return toast(e.message||'Image upload failed')}}const obj={id,name,category:cat,price,discount,stock,color:variants[0]?.color||'#6e381f',type:cat==='bags'?'bag':cat==='wallets'?'wallet':'shoe',sizes,active:document.getElementById('pActive')?.value==='1',image_url,updated_at:new Date().toISOString()};const q=exists?sb.from('products').update(obj).eq('id',id):sb.from('products').insert(obj);const {error}=await q;if(error){if(btn){btn.disabled=false;btn.textContent=t('save')}return toast(error.message||'Could not save product')}const synced=await sb.rpc('sync_product_variants',{p_product_id:id,p_variants:variants});if(synced.error){if(btn){btn.disabled=false;btn.textContent=t('save')}return toast(synced.error.message||'Could not save stock options')}closeOverlay();await loadAdminData();renderAdminReplace('products')}
async function deleteProduct(id){if(!confirm(lang==='ar'?'حذف المنتج نهائياً؟':'Delete product permanently?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)return toast(error.message||'Could not delete product');await loadAdminData();renderAdminReplace('products')}
async function exitAdmin(){document.getElementById('adminApp')?.remove();document.getElementById('customerApp').classList.remove('hidden');document.getElementById('bottomnav').classList.remove('hidden');await loadProducts();renderProducts()}
async function bootstrapApp(){applyLang();updateCartBadge();await loadProducts();await syncSupabaseSession();if(IS_RECOVERY_RETURN&&currentUser)setTimeout(renderPasswordReset,100);else if(!currentUser&&(AUTH_ERROR_CODE||AUTH_ERROR_DESCRIPTION))setTimeout(showAuthLinkError,80)}
function showDrawer(html){document.getElementById('overlay').innerHTML=`<div class="drawer" onclick="if(event.target===this)closeOverlay()"><div class="drawer-panel">${html}</div></div>`}function showModal(html){document.getElementById('overlay').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeOverlay()"><div class="modal">${html}</div></div>`}function closeOverlay(){document.getElementById('overlay').innerHTML=''}function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.add('hidden'),2400)}function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
let deferredInstallPrompt=null;
let installWelcomeShown=false;

function showInstallWelcome(){
  if(RETURNED_FROM_EMAIL_AUTH||IS_RECOVERY_RETURN||AUTH_ERROR_CODE||AUTH_ERROR_DESCRIPTION||authWelcomeShown) return;
  if(window.matchMedia('(display-mode: standalone)').matches) return;
  if(installWelcomeShown) return;
  installWelcomeShown=true;
  showModal(`<div class="success" style="padding:18px 8px 8px">
    <img src="assets/SNB-App-Icon.png" alt="SNB" style="width:92px;height:92px;border-radius:24px;margin-bottom:14px;box-shadow:0 10px 35px rgba(215,168,78,.25)">
    <h3 style="margin:0 0 8px;font-family:Georgia,serif;color:#f3d58c">SNB Leather Goods</h3>
    <p class="muted" style="margin:0 0 18px">ثبّت التطبيق على موبايلك ليظهر كتطبيق مستقل.</p>
    <button class="btn gold" style="width:100%;margin-bottom:8px" onclick="installSNB()">⬇️ تثبيت التطبيق</button>
    <button class="btn ghost" style="width:100%" onclick="closeOverlay()">المتابعة في المتصفح</button>
  </div>`);
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  document.getElementById('installBtn')?.classList.remove('hidden');
  if(!installWelcomeShown) setTimeout(showInstallWelcome,250);
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  document.getElementById('installBtn')?.classList.add('hidden');
  closeOverlay();
  toast('تم تثبيت SNB ✓');
});

async function installSNB(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted'){
      closeOverlay();
      toast('تم تثبيت SNB ✓');
    }
    deferredInstallPrompt=null;
    document.getElementById('installBtn')?.classList.add('hidden');
    return;
  }
  toast('إذا لم تظهر نافذة التثبيت، افتح الرابط في Chrome ثم اختر Install app / Add to Home screen');
}

if(window.matchMedia('(display-mode: standalone)').matches){
  document.getElementById('installBtn')?.classList.add('hidden');
}else{
  setTimeout(showInstallWelcome,700);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});bootstrapApp();
