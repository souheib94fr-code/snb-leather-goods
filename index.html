let lang=localStorage.getItem('snb_lang')||'ar';let category='all';let cart=JSON.parse(localStorage.getItem('snb_cart')||'[]');let products=JSON.parse(localStorage.getItem('snb_products')||'null')||DEFAULT_PRODUCTS;let customers=JSON.parse(localStorage.getItem('snb_customers')||'[]');let orders=JSON.parse(localStorage.getItem('snb_orders')||'[]');let currentUser=JSON.parse(localStorage.getItem('snb_user')||'null');
const t=k=>I18N[lang]?.[k]||I18N.en[k]||k;
function save(){localStorage.setItem('snb_products',JSON.stringify(products));localStorage.setItem('snb_cart',JSON.stringify(cart));localStorage.setItem('snb_customers',JSON.stringify(customers));localStorage.setItem('snb_orders',JSON.stringify(orders));if(currentUser)localStorage.setItem('snb_user',JSON.stringify(currentUser));else localStorage.removeItem('snb_user')}
function money(v){return new Intl.NumberFormat(lang==='ar'?'ar-AE':'en-AE',{style:'currency',currency:'AED',maximumFractionDigits:2}).format(v)}
function finalPrice(p){return +(p.price*(1-(p.discount||0)/100)).toFixed(2)}
function productSvg(p){const c=p.color||'#6b3e25', gold='#d7a84e';let shape='';if(p.type==='bag')shape=`<path d="M28 42h64v46H28z" fill="${c}" stroke="${gold}" stroke-width="2.6" rx="8"/><path d="M45 42c0-19 30-19 30 0" fill="none" stroke="${gold}" stroke-width="5" stroke-linecap="round"/><path d="M34 54h52" stroke="rgba(255,255,255,.2)"/>`;else if(p.type==='wallet')shape=`<rect x="25" y="37" width="70" height="48" rx="9" fill="${c}" stroke="${gold}" stroke-width="2.6"/><path d="M65 53h30v18H65z" fill="rgba(0,0,0,.3)" stroke="${gold}"/><circle cx="84" cy="62" r="3" fill="${gold}"/>`;else shape=`<path d="M18 73c17 0 25-8 31-26 4-12 12-18 21-14 8 3 9 13 17 18 8 6 17 9 23 13 7 5 5 17-3 19-24 6-64 5-86 0-9-2-10-10-3-10z" fill="${c}" stroke="${gold}" stroke-width="2.6"/><path d="M48 52l30 11M52 46l28 11" stroke="${gold}" stroke-width="2"/>`;return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="g${p.id}" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs>${shape}<rect width="120" height="120" fill="url(#g${p.id})" opacity=".7"/></svg>`}
function productVisual(p){return p.image?`<img src="${p.image}" alt="${escapeHtml(p.name||'SNB product')}" loading="lazy">`:productSvg(p)}
function previewProductImage(input){const file=input.files&&input.files[0];if(!file)return;const img=document.getElementById('pImagePreview');if(img){img.src=URL.createObjectURL(file);img.classList.remove('hidden')}}
function compressProductImage(file,targetW=1200,targetH=1500,quality=.82){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const canvas=document.createElement('canvas');canvas.width=targetW;canvas.height=targetH;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,targetW,targetH);const scale=Math.min(targetW/im.width,targetH/im.height,1);const w=Math.round(im.width*scale),h=Math.round(im.height*scale);const x=Math.round((targetW-w)/2),y=Math.round((targetH-h)/2);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(im,x,y,w,h);resolve(canvas.toDataURL('image/webp',quality))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.getElementById('langSelect').value=lang;renderFilters();renderProducts();updateCartBadge();updateAuthUI()}
document.getElementById('langSelect').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('snb_lang',lang);applyLang()});
function renderFilters(){const cats=['all','shoes','bags','wallets'];document.getElementById('filters').innerHTML=cats.map(c=>`<button class="chip ${category===c?'active':''}" onclick="setCategory('${c}')">${t(c)}</button>`).join('')}
function setCategory(c){category=c;renderFilters();renderProducts()}
function renderProducts(){const list=products.filter(p=>p.active&&(category==='all'||p.category===category));document.getElementById('productGrid').innerHTML=list.map(p=>`<article class="product">${p.discount?`<div class="sale">-${p.discount}%</div>`:''}<div class="product-media" onclick="viewProduct('${p.id}')">${productVisual(p)}</div><div class="product-body"><h4>${p.name}</h4><div class="price"><strong>${money(finalPrice(p))}</strong>${p.discount?`<span class="old">${money(p.price)}</span>`:''}</div><div class="meta"><span>${t('stock')}: ${p.stock}</span><span>${t(p.category)}</span></div><div class="product-actions"><button class="btn gold small" onclick="addToCart('${p.id}')">${t('addCart')}</button><button class="btn small" onclick="viewProduct('${p.id}')">⌕</button></div></div></article>`).join('')||`<div class="empty" style="grid-column:1/-1">—</div>`}
function updateCartBadge(){document.getElementById('cartBadge').textContent=cart.reduce((s,i)=>s+i.qty,0)}
function addToCart(id,size=''){const p=products.find(x=>x.id===id);if(!p||p.stock<1)return toast(lang==='ar'?'نفد المخزون':'Out of stock');const inCart=cart.filter(i=>i.id===id).reduce((s,i)=>s+i.qty,0);if(inCart>=p.stock)return toast(lang==='ar'?('المتوفر فقط '+p.stock+' قطعة'):(('Only '+p.stock+' item'+(p.stock===1?'':'s')+' available')));const chosenSize=size||p.sizes.split(',')[0];const found=cart.find(i=>i.id===id&&i.size===chosenSize);if(found)found.qty++;else cart.push({id,qty:1,size:chosenSize});save();updateCartBadge();toast(t('addCart')+' ✓')}
function viewProduct(id){const p=products.find(x=>x.id===id);const sizes=p.sizes.split(',').map(s=>s.trim());showModal(`<div class="modal-head"><h3>${p.name}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="productdetail"><div class="product-media product-detail-media" style="border-radius:18px">${productVisual(p)}</div><div><div class="price"><strong style="font-size:25px">${money(finalPrice(p))}</strong>${p.discount?`<span class="old">${money(p.price)}</span>`:''}</div><p class="muted">SNB Leather Goods · SUBSTANCE • NUANCE • BRILLIANCE</p><div class="field"><label>${t('size')}</label><select id="modalSize">${sizes.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>${t('color')}</label><div style="width:34px;height:34px;border-radius:50%;background:${p.color};border:2px solid #d7a84e"></div></div><p>${t('stock')}: <b>${p.stock}</b></p><button class="btn gold" style="width:100%" onclick="addToCart('${p.id}',document.getElementById('modalSize').value);closeOverlay()">${t('addCart')}</button></div></div>`)}
function openCart(){const items=cart.map(i=>{const p=products.find(x=>x.id===i.id);return p?{...i,p}:null}).filter(Boolean);const subtotal=items.reduce((s,i)=>s+i.p.price*i.qty,0),total=items.reduce((s,i)=>s+finalPrice(i.p)*i.qty,0);showDrawer(`<div class="drawer-head"><h3>${t('cart')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div>${items.length?items.map((i,idx)=>`<div class="cart-item"><div class="cart-thumb">${productVisual(i.p)}</div><div><b>${i.p.name}</b><div class="muted" style="font-size:12px;margin-top:5px">${t('size')}: ${i.size}</div><div style="color:#f1cf7f;margin-top:5px">${money(finalPrice(i.p))}</div><div class="qty" style="margin-top:8px"><button onclick="cartQty(${idx},-1)">−</button><b>${i.qty}</b><button onclick="cartQty(${idx},1)">+</button></div></div><button class="iconbtn" onclick="removeCart(${idx})">🗑</button></div>`).join(''):`<div class="empty">${t('emptyCart')}</div>`}${items.length?`<div class="totals"><div class="totalrow"><span>${t('subtotal')}</span><span>${money(subtotal)}</span></div><div class="totalrow"><span>${t('discount')}</span><span>− ${money(subtotal-total)}</span></div><div class="totalrow"><span>${t('shipping')}</span><span>${t('free')}</span></div><div class="totalrow big"><span>${t('total')}</span><span>${money(total)}</span></div><button class="btn gold" style="width:100%;margin-top:10px" onclick="checkout()">${t('checkout')}</button></div>`:''}`)}
function cartQty(idx,d){const item=cart[idx];if(!item)return;const p=products.find(x=>x.id===item.id);if(d>0&&p){const inCart=cart.filter(i=>i.id===item.id).reduce((s,i)=>s+i.qty,0);if(inCart>=p.stock)return toast(lang==='ar'?('المتوفر فقط '+p.stock+' قطعة'):(('Only '+p.stock+' item'+(p.stock===1?'':'s')+' available')))}item.qty+=d;if(item.qty<=0)cart.splice(idx,1);save();updateCartBadge();openCart()}function removeCart(idx){cart.splice(idx,1);save();updateCartBadge();openCart()}
function checkout(){if(!currentUser){closeOverlay();openAuth(true);return}const items=cart.map(i=>{const p=products.find(x=>x.id===i.id);return {...i,name:p.name,price:finalPrice(p)}});const total=items.reduce((s,i)=>s+i.price*i.qty,0);showModal(`<div class="modal-head"><h3>${t('checkout')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="notice">🔒 ${t('demoFooter')}</div><div class="field"><label>${t('customer')}</label><input value="${escapeHtml(currentUser.name||'')}" disabled></div><div class="field"><label>${t('email')}</label><input value="${escapeHtml(currentUser.email||'—')}" disabled></div><div class="field"><label>${t('mobile')}</label><input value="${escapeHtml(currentUser.mobile||'—')}" disabled></div><div class="field"><label>${t('shipping')}</label><textarea id="address" rows="3" placeholder="Dubai, UAE"></textarea></div><div class="totals"><div class="totalrow big"><span>${t('total')}</span><span>${money(total)}</span></div></div><button class="btn gold" style="width:100%" onclick="payTest()">💳 ${t('testPay')}</button>`)}
function payTest(){const items=cart.map(i=>{const p=products.find(x=>x.id===i.id);return {...i,name:p.name,price:finalPrice(p)}});const total=items.reduce((s,i)=>s+i.price*i.qty,0);const o={id:'SNB-'+Date.now().toString().slice(-8),customer:currentUser?.name||'Guest',email:currentUser?.email||'',mobile:currentUser?.mobile||'',total,items,date:new Date().toLocaleString(),status:'Paid (Test)'};orders.unshift(o);cart=[];save();updateCartBadge();showModal(`<div class="success"><div class="check">✓</div><h3>${t('orderSuccess')}</h3><p>${t('orderNo')}: <b>${o.id}</b></p><p style="color:#f2cf7b;font-size:22px"><b>${money(total)}</b></p><button class="btn gold" onclick="closeOverlay()">${t('continue')}</button></div>`)}
function accountLabel(){return ({ar:'حسابي',en:'My Account',fr:'Mon compte',es:'Mi cuenta',ru:'Мой аккаунт',it:'Il mio account',de:'Mein Konto'})[lang]||'My Account'}
function signedInLabel(){return ({ar:'تم تسجيل الدخول',en:'Signed in',fr:'Connecté',es:'Sesión iniciada',ru:'Вход выполнен',it:'Accesso effettuato',de:'Angemeldet'})[lang]||'Signed in'}
function updateAuthUI(){const signed=!!currentUser;const top=document.getElementById('topAccountBtn');const hero=document.getElementById('heroAuthBtn');const bottomLabel=document.getElementById('bottomAccountLabel');const bottomIcon=document.getElementById('bottomAccountIcon');if(top)top.innerHTML=signed?`✓ <span>${accountLabel()}</span>`:`👤 <span>${accountLabel()}</span>`;if(hero)hero.textContent=signed?`✓ ${accountLabel()}`:t('signIn');if(bottomLabel)bottomLabel.textContent=accountLabel();if(bottomIcon)bottomIcon.textContent=signed?'✓':'👤'}
function renderAccount(){if(!currentUser)return renderAuth();showModal(`<div class="modal-head"><h3>${accountLabel()}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="success" style="padding:10px 4px"><div class="check">✓</div><h3 style="margin:8px 0">${signedInLabel()} ✓</h3><p class="muted">${lang==='ar'?'أنت الآن داخل حسابك كعميل في SNB Leather Goods.':'You are signed in as an SNB Leather Goods customer.'}</p><div class="notice" style="margin:14px 0"><b>${escapeHtml(currentUser.email||'')}</b></div><button class="btn ghost" style="width:100%" onclick="logoutCustomer()">${t('logout')}</button></div>`)}
function openAuth(fromCheckout=false){if(currentUser){if(fromCheckout){checkout();return}return renderAccount()}window._auth={fromCheckout};renderAuth()}
function renderAuth(){const a=window._auth||{fromCheckout:false};showModal(`<div class="modal-head"><h3>${lang==='ar'?'تأكيد البريد الإلكتروني':t('account')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="notice">${t('otpDemo')}</div><div class="field"><label>${t('email')}</label><input id="authEmail" type="email" autocomplete="email"></div><button class="btn gold" style="width:100%" onclick="sendOtp()">${t('sendOtp')}</button>`)}
async function logoutCustomer(){const {error}=await sb.auth.signOut();if(error)return toast(error.message||'Could not sign out');currentUser=null;save();updateAuthUI();closeOverlay();toast(lang==='ar'?'تم تسجيل الخروج بنجاح':'Signed out successfully')}
async function sendOtp(){const a=window._auth||{fromCheckout:false};const email=document.getElementById('authEmail')?.value.trim().toLowerCase()||'';if(!email||!email.includes('@'))return toast(lang==='ar'?'أدخل بريداً إلكترونياً صحيحاً':'Enter a valid email');if(a.fromCheckout)localStorage.setItem('snb_pending_checkout','1');const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:AUTH_RETURN_URL}});if(error)return toast(error.message||'Could not send confirmation link');showModal(`<div class="success"><div class="check">✉</div><h3>${lang==='ar'?'تحقق من بريدك الإلكتروني':'Check your email'}</h3><p>${lang==='ar'?'أرسلنا رابط تأكيد إلى':'We sent a confirmation link to'}</p><p style="color:#f2cf7b"><b>${escapeHtml(email)}</b></p><p class="muted">${lang==='ar'?'اضغط على الرابط داخل الرسالة. بعد التأكيد سيتم تسجيل بريدك كعميل في SNB.':'Open the email and click the link. After confirmation, your email will be registered as an SNB customer.'}</p><button class="btn gold" onclick="closeOverlay()">${lang==='ar'?'حسناً':'OK'}</button></div>`)}
function showAuthWelcome(){if(authWelcomeShown)return;authWelcomeShown=true;showModal(`<div class="success" style="padding:18px 8px 8px"><div class="check">✓</div><h3 style="margin-bottom:8px">${lang==='ar'?'تم تأكيد بريدك بنجاح ✓':'Confirmed successfully ✓'}</h3><p style="font-size:18px;color:#f3d58c"><b>Welcome to SNB Leather Goods</b></p><p class="muted">${lang==='ar'?'تم تسجيل دخولك وأصبح حسابك جاهزاً.':'You are signed in and your account is ready.'}</p><button class="btn gold" style="width:100%" onclick="closeOverlay();setTimeout(renderAccount,50)">${lang==='ar'?'متابعة إلى حسابي':'Continue to My Account'}</button></div>`);try{history.replaceState({},document.title,APP_URL)}catch(e){}}
function setSignedInCustomer(u,notify=false){if(!u)return;currentUser={id:u.id,name:u.user_metadata?.name||u.email?.split('@')[0]||'SNB Customer',email:u.email||'',mobile:u.user_metadata?.mobile||'',created:u.created_at||new Date().toLocaleString(),orders:0};const existing=customers.findIndex(x=>x.id===currentUser.id);if(existing>=0)customers[existing]={...customers[existing],...currentUser};else customers.push(currentUser);save();updateAuthUI();if(notify)showAuthWelcome();if(localStorage.getItem('snb_pending_checkout')==='1'){localStorage.removeItem('snb_pending_checkout');setTimeout(checkout,350)}}
async function syncSupabaseSession(){try{for(let attempt=0;attempt<12;attempt++){const {data}=await sb.auth.getSession();const u=data?.session?.user;if(u){setSignedInCustomer(u,false);if(RETURNED_FROM_EMAIL_AUTH)showAuthWelcome();return true}if(!RETURNED_FROM_EMAIL_AUTH)break;await new Promise(r=>setTimeout(r,250))}if(currentUser&&!RETURNED_FROM_EMAIL_AUTH){currentUser=null;save();updateAuthUI()}return false}catch(e){return false}}
sb.auth.onAuthStateChange((event,session)=>{if(session?.user){setSignedInCustomer(session.user,false);if(RETURNED_FROM_EMAIL_AUTH&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))showAuthWelcome()}else if(event==='SIGNED_OUT'){currentUser=null;save();updateAuthUI()}});
syncSupabaseSession();
function openAdminLogin(){showModal(`<div class="modal-head"><h3>${t('adminLogin')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="field"><label>${t('adminPass')}</label><input id="adminCode" type="password" autocomplete="current-password"></div><button class="btn gold" style="width:100%" onclick="adminAuth()">${t('login')}</button>`)}
function adminAuth(){if(document.getElementById('adminCode').value!=='SNB9494')return toast('Wrong admin code');closeOverlay();renderAdmin('dashboard')}
function renderAdmin(tab='dashboard'){document.getElementById('customerApp').classList.add('hidden');document.getElementById('bottomnav').classList.add('hidden');let revenue=orders.reduce((s,o)=>s+o.total,0);document.body.insertAdjacentHTML('beforeend',`<div id="adminApp" class="admin"><header class="topbar" style="position:sticky"><div class="logo"><img src="assets/SNB-App-Icon.png"><div class="logo-text"><b>SNB ADMIN</b><small>LEATHER GOODS</small></div></div><div class="spacer"></div><button class="btn" onclick="exitAdmin()">← ${t('shop')}</button></header><div class="admin-shell"><aside class="sidebar"><button class="btn ${tab==='dashboard'?'gold':''}" onclick="renderAdminReplace('dashboard')">▦ ${t('dashboard')}</button><button class="btn ${tab==='products'?'gold':''}" onclick="renderAdminReplace('products')">◇ ${t('products')}</button><button class="btn ${tab==='orders'?'gold':''}" onclick="renderAdminReplace('orders')">🧾 ${t('orders')}</button><button class="btn ${tab==='customers'?'gold':''}" onclick="renderAdminReplace('customers')">👥 ${t('customers')}</button></aside><main class="admin-main" id="adminMain"></main></div></div>`);renderAdminTab(tab,revenue)}
function renderAdminReplace(tab){document.getElementById('adminApp')?.remove();renderAdmin(tab)}
function renderAdminTab(tab,revenue){const el=document.getElementById('adminMain');if(tab==='dashboard'){el.innerHTML=`<div class="section-head"><div><h3>${t('dashboard')}</h3><span>${t('demoHint')}</span></div></div><div class="stats"><div class="stat"><b>${products.length}</b><small>${t('products')}</small></div><div class="stat"><b>${customers.length}</b><small>${t('registered')}</small></div><div class="stat"><b>${orders.length}</b><small>${t('orders')}</small></div><div class="stat"><b>${money(revenue)}</b><small>${t('revenue')}</small></div></div><div class="notice" style="margin-top:14px">${t('demoHint')}</div>`}
if(tab==='products'){el.innerHTML=`<div class="section-head"><div><h3>${t('products')}</h3><span>${products.length}</span></div><div class="spacer"></div><button class="btn gold" onclick="editProduct()">＋ ${t('addProduct')}</button></div><div class="tablewrap"><table class="table"><thead><tr><th>${t('productName')}</th><th>${t('category')}</th><th>${t('price')}</th><th>${t('discount')}</th><th>${t('stock')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${p.name}</b></td><td>${t(p.category)}</td><td>${money(p.price)}</td><td>${p.discount||0}%</td><td>${p.stock}</td><td><span class="status ${p.active?'ok':'warn'}">${p.active?t('active'):t('inactive')}</span></td><td><button class="btn small" onclick="editProduct('${p.id}')">${t('edit')}</button> <button class="btn small danger" onclick="deleteProduct('${p.id}')">${t('delete')}</button></td></tr>`).join('')}</tbody></table></div>`}
if(tab==='orders'){el.innerHTML=`<div class="section-head"><div><h3>${t('orders')}</h3><span>${orders.length}</span></div></div><div class="tablewrap"><table class="table"><thead><tr><th>${t('orderNo')}</th><th>${t('customer')}</th><th>${t('items')}</th><th>${t('total')}</th><th>${t('status')}</th><th>${t('date')}</th></tr></thead><tbody>${orders.length?orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${escapeHtml(o.customer)}<br><small class="muted">${escapeHtml(o.email||o.mobile)}</small></td><td>${o.items.reduce((s,i)=>s+i.qty,0)}</td><td>${money(o.total)}</td><td><span class="status ok">${o.status}</span></td><td>${o.date}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">—</td></tr>`}</tbody></table></div>`}
if(tab==='customers'){el.innerHTML=`<div class="section-head"><div><h3>${t('customers')}</h3><span>${customers.length}</span></div></div><div class="tablewrap"><table class="table"><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('mobile')}</th><th>${t('date')}</th></tr></thead><tbody>${customers.length?customers.map(c=>`<tr><td><b>${escapeHtml(c.name)}</b></td><td>${escapeHtml(c.email||'—')}</td><td>${escapeHtml(c.mobile||'—')}</td><td>${c.created}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">—</td></tr>`}</tbody></table></div>`}}
function editProduct(id=''){const p=id?products.find(x=>x.id===id):{id:'p'+Date.now(),name:'',category:'shoes',price:0,discount:0,stock:0,color:'#6e381f',type:'shoe',sizes:'40,41,42,43,44',active:true,image:''};showModal(`<div class="modal-head"><h3>${id?t('edit'):t('addProduct')}</h3><button class="iconbtn close" onclick="closeOverlay()">✕</button></div><div class="field"><label>${lang==='ar'?'صورة المنتج':'Product photo'}</label>${p.image?`<img id="pImagePreview" class="image-preview" src="${p.image}" alt="">`:`<img id="pImagePreview" class="image-preview hidden" alt="">`}<input id="pImage" type="file" accept="image/*" onchange="previewProductImage(this)"><small class="muted">${lang==='ar'?'اختر صورة من الموبايل. سيتم ضغطها تلقائياً.':'Choose a photo from your phone. It will be compressed automatically.'}</small></div><div class="formgrid"><div class="field"><label>${t('productName')}</label><input id="pName" value="${escapeHtml(p.name)}"></div><div class="field"><label>${t('category')}</label><select id="pCat"><option value="shoes" ${p.category==='shoes'?'selected':''}>${t('shoes')}</option><option value="bags" ${p.category==='bags'?'selected':''}>${t('bags')}</option><option value="wallets" ${p.category==='wallets'?'selected':''}>${t('wallets')}</option></select></div><div class="field"><label>${t('price')} AED</label><input id="pPrice" type="number" value="${p.price}"></div><div class="field"><label>${t('discount')} %</label><input id="pDiscount" type="number" min="0" max="90" value="${p.discount}"></div><div class="field"><label>${t('stock')}</label><input id="pStock" type="number" min="0" value="${p.stock}"></div><div class="field"><label>${t('color')}</label><input id="pColor" type="color" value="${p.color}"></div><div class="field"><label>${t('size')}</label><input id="pSizes" value="${p.sizes}"></div><div class="field"><label>${t('status')}</label><select id="pActive"><option value="1" ${p.active?'selected':''}>${t('active')}</option><option value="0" ${!p.active?'selected':''}>${t('inactive')}</option></select></div></div><button class="btn gold" style="width:100%" onclick="saveProduct('${p.id}',${id?1:0})">${t('save')}</button>`)}
async function saveProduct(id,exists){const cat=document.getElementById('pCat').value;const old=exists?products.find(x=>x.id===id):null;let image=old?.image||'';const file=document.getElementById('pImage')?.files?.[0];if(file){try{image=await compressProductImage(file)}catch(e){toast(lang==='ar'?'تعذر قراءة الصورة':'Could not read image');return}}const obj={id,name:document.getElementById('pName').value.trim(),category:cat,price:+document.getElementById('pPrice').value,discount:+document.getElementById('pDiscount').value,stock:+document.getElementById('pStock').value,color:document.getElementById('pColor').value,type:cat==='bags'?'bag':cat==='wallets'?'wallet':'shoe',sizes:document.getElementById('pSizes').value,active:document.getElementById('pActive').value==='1',image};if(exists){const i=products.findIndex(x=>x.id===id);products[i]=obj}else products.unshift(obj);try{save()}catch(e){toast(lang==='ar'?'الصورة كبيرة جداً. اختر صورة أصغر.':'Image is too large. Choose a smaller image.');return}closeOverlay();renderAdminReplace('products')}
function deleteProduct(id){if(!confirm('Delete product?'))return;products=products.filter(x=>x.id!==id);save();renderAdminReplace('products')}
function exitAdmin(){document.getElementById('adminApp')?.remove();document.getElementById('customerApp').classList.remove('hidden');document.getElementById('bottomnav').classList.remove('hidden');renderProducts()}
function showDrawer(html){document.getElementById('overlay').innerHTML=`<div class="drawer" onclick="if(event.target===this)closeOverlay()"><div class="drawer-panel">${html}</div></div>`}function showModal(html){document.getElementById('overlay').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeOverlay()"><div class="modal">${html}</div></div>`}function closeOverlay(){document.getElementById('overlay').innerHTML=''}function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.add('hidden'),2400)}function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
let deferredInstallPrompt=null;
let installWelcomeShown=false;

function showInstallWelcome(){
  if(RETURNED_FROM_EMAIL_AUTH||authWelcomeShown) return;
  if(window.matchMedia('(display-mode: standalone)').matches) return;
  if(installWelcomeShown) return;
  installWelcomeShown=true;
  showModal(`<div class="success" style="padding:18px 8px 8px">
    <img src="assets/SNB-App-Icon.png" alt="SNB" style="width:92px;height:92px;border-radius:24px;margin-bottom:14px;box-shadow:0 10px 35px rgba(215,168,78,.25)">
    <h3 style="margin:0 0 8px;font-family:Georgia,serif;color:#f3d58c">SNB Leather Goods</h3>
    <p class="muted" style="margin:0 0 18px">ثبّت التطبيق على موبايلك ليظهر كتطبيق مستقل.</p>
    <button class="btn gold" style="width:100%;margin-bottom:8px" onclick="installSNB()">⬇️ تثبيت التطبيق</button>
    <button class="btn ghost" style="width:100%" onclick="closeOverlay()">المتابعة في المتصفح</button>
  </div>`);
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  document.getElementById('installBtn')?.classList.remove('hidden');
  if(!installWelcomeShown) setTimeout(showInstallWelcome,250);
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  document.getElementById('installBtn')?.classList.add('hidden');
  closeOverlay();
  toast('تم تثبيت SNB ✓');
});

async function installSNB(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted'){
      closeOverlay();
      toast('تم تثبيت SNB ✓');
    }
    deferredInstallPrompt=null;
    document.getElementById('installBtn')?.classList.add('hidden');
    return;
  }
  toast('إذا لم تظهر نافذة التثبيت، افتح الرابط في Chrome ثم اختر Install app / Add to Home screen');
}

if(window.matchMedia('(display-mode: standalone)').matches){
  document.getElementById('installBtn')?.classList.add('hidden');
}else{
  setTimeout(showInstallWelcome,700);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});applyLang();updateCartBadge();
</script>
